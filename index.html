<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Little Pomodoro</title>
  <meta name="description" content="A beautiful Italian-inspired newborn tracker for feeds, bottles, pee and poop.">
  <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0C0F" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pomodoro">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Reusable icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-tomato" viewBox="0 0 64 64">
        <path d="M32 18c14 0 25 9 25 21S46 58 32 58 7 51 7 39s11-21 25-21z" fill="var(--tomato)"/>
        <path d="M18 30c2-5 7-8 12-8" stroke="#fff" stroke-opacity=".45" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M32 21c-3-4-9-6-14-5 4 1 7 3 9 6-5 0-9 2-11 5 5-1 10 0 13 1 1 3 1 6 0 9 3-2 4-5 4-8 3 1 8 1 12-1-4-1-7-3-9-5 3-2 7-3 12-3-5-2-11-1-14 2 0-3-1-6-2-8-1 2-1 5 0 7z" fill="var(--basil)"/>
        <path d="M32 21c0-5 2-9 5-11" stroke="var(--basil)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      </symbol>
      <symbol id="i-breast" viewBox="0 0 24 24">
        <path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <circle cx="12" cy="13" r="1.6" fill="currentColor"/>
      </symbol>
      <symbol id="i-bottle" viewBox="0 0 24 24">
        <path d="M10 2.8h4M10.5 2.8v2.4L9 7.2h6l-1.5-2V2.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
        <rect x="7.5" y="7.2" width="9" height="14" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M7.5 13.5h9" stroke="currentColor" stroke-width="1.4"/>
        <path d="M10 10.3h2M10 16.5h2M10 18.8h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-drop" viewBox="0 0 24 24">
        <path d="M12 3s6.5 7.2 6.5 11.6A6.5 6.5 0 0 1 5.5 14.6C5.5 10.2 12 3 12 3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M9 15.2a3 3 0 0 0 2.6 2.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </symbol>
      <symbol id="i-poop" viewBox="0 0 24 24">
        <path d="M12.6 3.5c1.5.9 1.8 2.6 1 3.7 2 .1 3.3 1.4 3.3 3a2.6 2.6 0 0 1-.3 1.2c2 .3 3.4 1.9 3.4 3.7 0 2.4-2 4.4-4.5 4.4H8.4C5.9 19.5 4 17.6 4 15.2c0-1.9 1.3-3.4 3.2-3.8a2.7 2.7 0 0 1-.2-1C7 8.9 8.3 7.6 10 7.4c-.2-1.4.6-3.2 2.6-3.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="9.7" cy="14.6" r=".95" fill="currentColor"/><circle cx="14.3" cy="14.6" r=".95" fill="currentColor"/>
      </symbol>
      <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-diary" viewBox="0 0 24 24"><path d="M6 3.5h11a1.5 1.5 0 0 1 1.5 1.5v15.5H7.5A2 2 0 0 1 5.5 18.5V4a.5.5 0 0 1 .5-.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M5.5 18.5a2 2 0 0 1 2-2h11M9 8h6M9 11.5h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-guide" viewBox="0 0 24 24"><path d="M12 6.5C10 4.8 7 4.3 3.5 4.8v13.7c3.5-.5 6.5 0 8.5 1.7 2-1.7 5-2.2 8.5-1.7V4.8C17 4.3 14 4.8 12 6.5zM12 6.5v13.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.8l1.6 2.5 2.9-.6.6 2.9 2.5 1.6-1.4 2.6 1.4 2.6-2.5 1.6-.6 2.9-2.9-.6L12 21.2l-1.6-2.5-2.9.6-.6-2.9-2.5-1.6L5.8 12 4.4 9.4l2.5-1.6.6-2.9 2.9.6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7" y="5.5" width="3.4" height="13" rx="1" fill="currentColor"/><rect x="13.6" y="5.5" width="3.4" height="13" rx="1" fill="currentColor"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
      <pattern id="tile" width="44" height="44" patternUnits="userSpaceOnUse">
        <path d="M22 4l6 12 12 6-12 6-6 12-6-12-12-6 12-6z" fill="none" stroke="#fff" stroke-width="1.2"/>
        <circle cx="22" cy="22" r="3" fill="#fff"/>
        <circle cx="0" cy="0" r="5" fill="none" stroke="#fff" stroke-width="1.2"/><circle cx="44" cy="0" r="5" fill="none" stroke="#fff" stroke-width="1.2"/>
        <circle cx="0" cy="44" r="5" fill="none" stroke="#fff" stroke-width="1.2"/><circle cx="44" cy="44" r="5" fill="none" stroke="#fff" stroke-width="1.2"/>
      </pattern>
    </defs>
  </svg>

  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark"><use href="#i-tomato"/></svg>
        <div>
          <div class="brand-name">My Little <em>Pomodoro</em></div>
          <div class="brand-sub" id="brandSub">Newborn tracker</div>
        </div>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Light / Dark">
        <svg><use href="#i-moon"/></svg>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button data-tab="today" class="active"><svg><use href="#i-today"/></svg><span>Today</span></button>
    <button data-tab="diary"><svg><use href="#i-diary"/></svg><span>History</span></button>
    <button data-tab="guide"><svg><use href="#i-guide"/></svg><span>Guide</span></button>
    <button data-tab="settings"><svg><use href="#i-home"/></svg><span>Settings</span></button>
  </nav>

  <!-- Bottom sheet -->
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <div>
        <div class="eyebrow" id="sheetEyebrow"></div>
        <h2 id="sheetTitle"></h2>
      </div>
      <button class="icon-btn" id="sheetClose" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
