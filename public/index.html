<!DOCTYPE html>
<html lang="en" data-skin="pomodoro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Little Pomodoro</title>
  <meta name="description" content="A modern, Italian-inspired baby tracker for the whole family — feeds, sleep, diapers, growth, photos and milestones.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pomodoro">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="theme-color" id="themeColor" content="#F4F5F7">
  <script>
    // Apply the saved theme before first paint (no flash), and load only that theme's fonts.
    window.POMODORO_FONTS = {
      pomodoro: 'family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700',
      positano: 'family=Plus+Jakarta+Sans:wght@400;500;600;700;800',
      limone: 'family=Sora:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700',
      milano: 'family=Instrument+Serif:ital@0;1&family=Onest:wght@400;500;600;700',
      toscana: 'family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700',
      gelato: 'family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800'
    };
    window.loadSkinFonts = function (skin) {
      if (!window.POMODORO_FONTS[skin] || document.getElementById('font-' + skin)) return;
      var l = document.createElement('link');
      l.rel = 'stylesheet'; l.id = 'font-' + skin;
      l.href = 'https://fonts.googleapis.com/css2?' + window.POMODORO_FONTS[skin] + '&display=swap';
      document.head.appendChild(l);
    };
    (function () {
      var s = {};
      try { s = JSON.parse(localStorage.getItem('pomodoro.prefs')) || (JSON.parse(localStorage.getItem('pomodoro.v1')) || {}).settings || {}; } catch (e) {}
      var skin = s.skin || 'pomodoro';
      document.documentElement.setAttribute('data-skin', skin);
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
      window.loadSkinFonts(skin);
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
</head>

  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="/brand/mark.webp" alt="My Little Pomodoro" width="40" height="39" decoding="async">
        <div>
          <div class="brand-name">My Little <em>Pomodoro</em></div>
          <div class="brand-sub" id="brandSub">Newborn tracker</div>
        </div>
      </div>
      <div class="top-actions">
        <span class="sync-pill" id="syncDot" hidden></span>
        <button class="icon-btn" data-act="themes" aria-label="Choose theme" title="Themes"><svg><use href="#i-palette"/></svg></button>
        <button class="icon-btn" data-act="toggle-dark" aria-label="Toggle dark mode" title="Light / Dark"><svg><use href="#i-moon"/></svg></button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main" hidden>
    <button data-act="tab" data-tab="today" class="active"><svg><use href="#i-today"/></svg><span>Today</span></button>
    <button data-act="tab" data-tab="history"><svg><use href="#i-diary"/></svg><span>History</span></button>
    <button data-act="tab" data-tab="growth"><svg><use href="#i-growth"/></svg><span>Growth</span></button>
    <button data-act="tab" data-tab="memories"><svg><use href="#i-photos"/></svg><span>Memories</span></button>
    <button data-act="tab" data-tab="more"><svg><use href="#i-more"/></svg><span>More</span></button>
  </nav>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <div>
        <div class="eyebrow" id="sheetEyebrow"></div>
        <h2 id="sheetTitle"></h2>
      </div>
      <button class="icon-btn" id="sheetClose" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="confirm" id="confirm" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
